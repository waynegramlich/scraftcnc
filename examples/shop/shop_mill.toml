# An example of a small knee mill converted to CNC.
name = "Shop mill"
kind = "machine"
language = "English"
version = "0.0.1"
machine = "mill"
controller = "@linuxcnc.toml"
tool_table = "@shop_mill_tools.toml"

# How the mill is run.
[preferences]
z_safe = "1 in"
clearance = "0.05 in"
tool_change_z = "2 in"
rapid_speed = "60 in/min"
drill_cycle = "G83"
through_overcut = "10 %"
stepover = "90 %"
ramp_angle = "3 deg"
finish_allowance = "0.05 in"

[table]
length = "34 in"
width = "9.5 in"
t_slots = 3
t_slot_pitch = "2.5 in"
t_slot_width = "0.625 in"
t_slot_depth = "0.75 in"

[spindle]
interface = "R8"
min_rpm = "100 rpm"
max_rpm = "5000 rpm"
reversible = true
flood = true
mist = false
air = false

[[axes]]
letter = "X"
travel = "18 in"
max_feed = "110 in/min"
max_acceleration = "10 in/s^2"
limit_switches = true
brake = false

[[axes]]
letter = "Y"
travel = "9 in"
max_feed = "110 in/min"
max_acceleration = "10 in/s^2"
limit_switches = true
brake = false

[[axes]]
letter = "Z"
travel = "16 in"
max_feed = "90 in/min"
max_acceleration = "10 in/s^2"
limit_switches = true
brake = true
