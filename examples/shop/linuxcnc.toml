# The baseline controller.
name = "LinuxCNC"
kind = "controller"
language = "English"
version = "0.0.1"
post_processor = "linuxcnc"
# The operator is told which tool to put in, and the program pauses
# (`M0`) until Start is pressed again.
tool_change = """
(MSG, Insert T{number:02d}: {description})
M0
T{number:02d} M6 G43 H{number:02d}
"""
