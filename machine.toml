# The machine's preferences and its tool table, for `solidcraftcnc`.
# Every measurement needs its unit ("0.25 in", "6 mm", "12 in/min",
# "1200 rpm", "3 deg", "90 %").  See `scmachine.py`.

[machine]
name = "Shop mill"
z_safe = "1 in"         # Above all of the hold down tooling.
clearance = "0.05 in"   # Rapids down stop this far above the work.
tool_change_z = "2 in"  # Rise here before every tool change.
tool_change = "T{number:02d}"   # The words that change the tool.
rapid_speed = "60 in/min"       # 1 inch per second (for estimates).
drill_cycle = "G83"     # G81, G73, G83, or "moves".
through_overcut = "10 %"        # Cuts through the part go 10% deeper.
stepover = "90 %"       # Pocket rings apart, of the tool's diameter.
ramp_angle = "3 deg"    # When a pocket is not drilled.

[[tools]]
number = 1
name = "1/4 inch 2 flute end mill"
kind = "end mill"
diameter = "0.25 in"
rpm = "1200 rpm"
feed = "12 in/min"      # 0.2 inch per second.
plunge = "6 in/min"

[[tools]]
number = 2
name = "1/8 inch drill"
kind = "drill"
diameter = "0.125 in"
rpm = "1200 rpm"
feed = "4 in/min"
plunge = "4 in/min"
peck = "0.05 in"

[[tools]]
number = 3
name = "7/32 inch drill"
kind = "drill"
diameter = "0.21875 in"
rpm = "1200 rpm"
feed = "4 in/min"
plunge = "4 in/min"
peck = "0.05 in"

[[tools]]
number = 4
name = "15/64 inch drill"
kind = "drill"
diameter = "0.234375 in"
rpm = "1200 rpm"
feed = "4 in/min"
plunge = "4 in/min"
peck = "0.05 in"

[[tools]]
number = 5
name = "90 degree chamfer mill"
kind = "chamfer"        # A V-bit, for bevels.
diameter = "0.02 in"    # At the tip.
angle = "90 deg"        # Included angle: 45 degree bevels.
rpm = "1200 rpm"
feed = "12 in/min"
plunge = "4 in/min"

[[tools]]
number = 6
name = "1/16 inch radius corner rounding end mill"
kind = "corner round"   # Rounds edges over to its radius.
diameter = "0.125 in"   # At the tip.
radius = "0.0625 in"
rpm = "1200 rpm"
feed = "12 in/min"
plunge = "4 in/min"
