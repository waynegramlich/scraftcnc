[project]
name = "scraftlinuxcnc"
version = "0.1.0"
description = "LinuxCNC's simulator on Linux and Windows, reached through JSON on a port."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
install_linuxcnc = "scraftlinuxcnc.install_linuxcnc:main"
serve_linuxcnc = "scraftlinuxcnc.serve_linuxcnc:main"
demo_linuxcnc = "scraftlinuxcnc.demo_linuxcnc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraftlinuxcnc"]
