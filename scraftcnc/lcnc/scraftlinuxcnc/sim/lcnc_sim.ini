# A simulated three axis inch mill, for `lcnc_bridge.py`.  It was made
# from LinuxCNC 2.9's `configs/sim/axis/axis.ini`, with:
#
# * Far faster motion than a real mill (20 in/s and 200 in/s^2), so
#   that a program runs through quickly.
# * Homing done at once, wherever the axes are.
# * `lcnc_bridge.py` as its display: no window, and none of LinuxCNC's
#   screens are installed.
# * No position file, so it always starts at the machine's zero.

[EMC]
VERSION = 1.1
MACHINE = scraftlinuxcnc simulated mill
DEBUG = 0

[DISPLAY]
# The path is from this directory, where LinuxCNC starts it.
DISPLAY = ./lcnc_bridge.py --port 5008
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 100.0
MAX_SPINDLE_OVERRIDE = 1.0
MAX_LINEAR_VELOCITY = 20.0
DEFAULT_LINEAR_VELOCITY = 0.5
DEFAULT_SPINDLE_SPEED = 1000
INTRO_TIME = 0
INCREMENTS = 1 in, 0.1 in, 10 mil, 1 mil

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = lcnc_sim.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = lcnc_sim.tbl

[HAL]
HALFILE = core_sim.hal
HALFILE = sim_spindle_encoder.hal

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 20.0
DEFAULT_LINEAR_ACCELERATION = 200.0
MAX_LINEAR_ACCELERATION = 200.0

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[AXIS_X]
MAX_VELOCITY = 20.0
MAX_ACCELERATION = 200.0
MIN_LIMIT = 0.0
MAX_LIMIT = 18.0

[AXIS_Y]
MAX_VELOCITY = 20.0
MAX_ACCELERATION = 200.0
MIN_LIMIT = 0.0
MAX_LIMIT = 9.0

[AXIS_Z]
MAX_VELOCITY = 20.0
MAX_ACCELERATION = 200.0
MIN_LIMIT = -16.0
MAX_LIMIT = 0.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 20.0
MAX_ACCELERATION = 200.0
FERROR = 0.050
MIN_FERROR = 0.010
MIN_LIMIT = 0.0
MAX_LIMIT = 18.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_SEQUENCE = 1

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 20.0
MAX_ACCELERATION = 200.0
FERROR = 0.050
MIN_FERROR = 0.010
MIN_LIMIT = 0.0
MAX_LIMIT = 9.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_SEQUENCE = 1

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 20.0
MAX_ACCELERATION = 200.0
FERROR = 0.050
MIN_FERROR = 0.010
MIN_LIMIT = -16.0
MAX_LIMIT = 0.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_SEQUENCE = 0
