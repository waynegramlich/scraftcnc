# Install LinuxCNC's simulator (`linuxcnc-uspace`, Debian 13 Trixie)
# on each kind of GitHub runner with `install_linuxcnc.py --yes`, as
# a user would (with `--yes` running the commands it would ask the
# user to run).  The jobs are independent: macOS on Apple Silicon has
# no hypervisor on GitHub, so it runs Debian in QEMU's software
# emulation and may take hours; the program prints the time on every
# line and a progress line every 5 minutes, so a timeout still shows
# how far it got.
name: probe linuxcnc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout: 60
          - os: windows-latest
            timeout: 60
          - os: macos-15-intel
            timeout: 90
          - os: macos-latest
            timeout: 355
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # A user's package lists are recent; a runner's may not be.
      - name: Refresh apt's package lists
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Facts
        run: |
          uname -a
          python --version
          if [ "$RUNNER_OS" = macOS ]; then
            sysctl -n machdep.cpu.brand_string || true
            echo "kern.hv_support=$(sysctl -n kern.hv_support)"
          fi

      - name: install_linuxcnc.py --yes
        run: python -u install_linuxcnc.py --yes

      - name: Keep the QEMU VM's console log
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: vm-console-${{ matrix.os }}
          path: ~/.cache/scraftcnc/vm/console.log
          if-no-files-found: ignore
