# Install LinuxCNC's simulator (`linuxcnc-uspace`, Debian 13 Trixie)
# on Linux and Windows runners with `install_linuxcnc.py --yes`, as a
# user would (with `--yes` running the commands it would ask the user
# to run), then run the demonstration's G-code in it with
# `demo_linuxcnc.py --yes` (`lcnc_panel.py` on `Xvfb`, which it installs
# in the target only for runs like these, with no screen).  The
# programs print the time on every line, so a timeout still shows how
# far it got.  `demo_timeout` (minutes) limits the G-code's run.
name: probe linuxcnc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout: 30
            demo_timeout: 20
          - os: windows-latest
            timeout: 45
            demo_timeout: 20
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # `scraftpybind` goes next to the project, where its
      # `scraftpybind.py` link points.
      - name: Get scraftpybind
        run: >-
          git clone --depth 1
          https://github.com/waynegramlich/scraftpybind.git ../scraftpybind

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # A user's package lists are recent; a runner's may not be.
      - name: Refresh apt's package lists
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Facts
        run: |
          uname -a
          python --version

      - name: install_linuxcnc.py --yes
        run: python -u install_linuxcnc.py --yes

      - name: demo_linuxcnc.py --yes
        env:
          DEMO_TIMEOUT: ${{ matrix.demo_timeout }}
        run: python -u demo_linuxcnc.py --yes --timeout "$DEMO_TIMEOUT"
