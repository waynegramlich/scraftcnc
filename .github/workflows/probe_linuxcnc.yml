# Install LinuxCNC's simulator (`linuxcnc-uspace`, Debian 13 Trixie)
# on each kind of GitHub runner with `install_linuxcnc.py --yes`, as
# a user would (with `--yes` running the commands it would ask the
# user to run), then run the demonstration's G-code in it with
# `demo_linuxcnc.py --yes` (AXIS on `Xvfb`, which it installs in the
# target only for runs like these, with no screen).  The jobs are
# independent: macOS on Apple Silicon has no hypervisor on GitHub, so
# it runs Debian in QEMU's software emulation, which is slow; the
# programs print the time on every line, so a timeout still shows
# how far it got.  `demo_timeout` (minutes) limits the G-code's run.
name: probe linuxcnc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout: 30
            demo_timeout: 20
          - os: windows-latest
            timeout: 45
            demo_timeout: 20
          - os: macos-15-intel
            timeout: 75
            demo_timeout: 30
          - os: macos-latest
            timeout: 240
            demo_timeout: 180
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # `scraftpybind` goes next to the project, where its
      # `scraftpybind.py` link points.
      - name: Get scraftpybind
        run: >-
          git clone --depth 1
          https://github.com/waynegramlich/scraftpybind.git ../scraftpybind

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # A user's package lists are recent; a runner's may not be.
      - name: Refresh apt's package lists
        if: runner.os == 'Linux'
        run: sudo apt-get update

      - name: Facts
        run: |
          uname -a
          python --version
          if [ "$RUNNER_OS" = macOS ]; then
            sysctl -n machdep.cpu.brand_string || true
            echo "kern.hv_support=$(sysctl -n kern.hv_support)"
          fi

      - name: install_linuxcnc.py --yes
        run: python -u install_linuxcnc.py --yes

      - name: demo_linuxcnc.py --yes
        env:
          DEMO_TIMEOUT: ${{ matrix.demo_timeout }}
        run: python -u demo_linuxcnc.py --yes --timeout "$DEMO_TIMEOUT"

      - name: Keep the QEMU VM's console log
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: vm-console-${{ matrix.os }}
          path: ~/.cache/scraftcnc/vm/console.log
          if-no-files-found: ignore
