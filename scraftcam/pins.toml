#
# One table per module to import; each key is a requirement for `pip`,
# and its value the SHA-256 digests its wheels must have.  When any
# requirement of a table has digests, all of them must (`pip` then
# checks every download, and installs wheels only).  An empty list
# means not checked.
#
# Any change to a table installs that module again, into a fresh
# directory.  The digests are printed by:
#
#     python3 -m scraftcam.packages NAME==VERSION ...

