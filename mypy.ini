# Configuration for `mypy`.  Python 3.11 is the floor that
# `scraftpybind` names.
[mypy]
python_version = 3.11
# `mypy --strict` is the norm everywhere (the user, 2026-11-03), so a
# plain `mypy` checks what the Python Coding Rules require.
strict = True
warn_unreachable = True
enable_error_code = ignore-without-code, redundant-expr, truthy-bool
files = scraftcnc, tests, scripts/show_demo.py
explicit_package_bases = True
# `scraftpybind.py` is generated, and checked by its own tests.
[mypy-scraftcnc.pybind.scraftpybind]
follow_imports = silent
