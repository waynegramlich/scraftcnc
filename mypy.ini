# Configuration for `mypy`.  Python 3.11 is the floor that
# `scraftpybind` names.
[mypy]
python_version = 3.11
# `mypy --strict` is the norm everywhere (the user, 2026-11-03), so a
# plain `mypy` checks what the Python Coding Rules require.
strict = True
warn_unreachable = True
enable_error_code = ignore-without-code, redundant-expr, truthy-bool
files = scraftcam, tests, show_demo.py, scripts/coverage_from_trace.py
explicit_package_bases = True
# `PySide6`, where `scraftcam.packages` installs it for the system
# Python 3.12 (`python3 -c "from scraftcam import packages;
# packages.require('PySide6')"` puts it there).
mypy_path = $HOME/.scraftcam/packages/cpython-312/PySide6
# `scraftpybind.py` is generated, and checked by its own tests.
[mypy-scraftcam.pybind.scraftpybind]
follow_imports = silent
# Errors in `PySide6`'s own stubs are not ours to fix (being on
# `mypy_path`, they would be checked as if they were).
[mypy-PySide6.*,shiboken6.*]
ignore_errors = True
