# A LinuxCNC simulator of the example shop's mill
# (`examples/shop/shop_mill.toml`), for `sim_linuxcnc.py`.  It was
# made from LinuxCNC 2.9's `configs/sim/axis/axis.ini`, with:
#
# * The mill's travel (X 18, Y 9, Z 16 in), feeds (110 in/min for X
#   and Y, 90 for Z) and accelerations (10 in/s^2).  The machine's
#   zero is X and Y at their low ends and Z at its top.
# * Homing done at once, wherever the axes are (no simulated home
#   switches, which refused to home a second time).
# * No manual tool change window: `core_sim.hal` already answers a
#   tool change at once, and `axis_manualtoolchange.hal` (left out)
#   would replace that with a window to click.
# * A feed override up to 10 times, to run a program quickly.
# * No position file, so it always starts at the machine's zero.
# * `lcnc_panel.py` as its display, in place of AXIS.
#
# Start it in the `lcnc` box (see `TASKS/3_Simulation/Context.md`):
#     distrobox enter lcnc -- linuxcnc lcnc_sim/shop_mill.ini

[EMC]
VERSION = 1.1
MACHINE = scraftcnc shop mill (simulated)
DEBUG = 0

[DISPLAY]
# Our own panel (`T.mlcp~3.4`) instead of AXIS; the path is from
# this directory, where LinuxCNC starts it.
DISPLAY = ../lcnc_panel.py --port 5007
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 10.0
MAX_SPINDLE_OVERRIDE = 1.0
MAX_LINEAR_VELOCITY = 1.833
DEFAULT_LINEAR_VELOCITY = 0.5
DEFAULT_SPINDLE_SPEED = 1000
INTRO_TIME = 0
TOOL_EDITOR = tooledit
INCREMENTS = 1 in, 0.1 in, 10 mil, 1 mil

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = shop_mill.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = shop_mill.tbl

[HAL]
HALFILE = core_sim.hal
HALFILE = sim_spindle_encoder.hal
HALUI = halui

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 1.833
DEFAULT_LINEAR_ACCELERATION = 10
MAX_LINEAR_ACCELERATION = 10

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[AXIS_X]
MAX_VELOCITY = 1.833
MAX_ACCELERATION = 10.0
MIN_LIMIT = 0.0
MAX_LIMIT = 18.0

[AXIS_Y]
MAX_VELOCITY = 1.833
MAX_ACCELERATION = 10.0
MIN_LIMIT = 0.0
MAX_LIMIT = 9.0

[AXIS_Z]
MAX_VELOCITY = 1.5
MAX_ACCELERATION = 10.0
MIN_LIMIT = -16.0
MAX_LIMIT = 0.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 1.833
MAX_ACCELERATION = 10.0
FERROR = 0.050
MIN_FERROR = 0.010
MIN_LIMIT = 0.0
MAX_LIMIT = 18.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_SEQUENCE = 1

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 1.833
MAX_ACCELERATION = 10.0
FERROR = 0.050
MIN_FERROR = 0.010
MIN_LIMIT = 0.0
MAX_LIMIT = 9.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_SEQUENCE = 1

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 1.5
MAX_ACCELERATION = 10.0
FERROR = 0.050
MIN_FERROR = 0.010
MIN_LIMIT = -16.0
MAX_LIMIT = 0.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_SEQUENCE = 0
